services:
  backend:
    build: ./backend
    container_name: strayassist-backend
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: strayassist-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://backend:8080
    depends_on:
      - backend
